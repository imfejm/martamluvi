<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marta Mluví</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero card">
        <div class="hero-copy">
          <h1>MARTA MLUVÍ</h1>
          <p class="lead">
            Ahoj, jsem Marta a&nbsp;moderuju. Asi jsme se už potkali a jsi tu
            pro kontakt.
            <span class="lead-arrow" aria-hidden="true">↓</span>
          </p>
        </div>

        <div class="hero-photo">
          <img src="img/portret.png" alt="Marta Mluví" />
        </div>

        <div class="photo-fill" aria-hidden="true"></div>

        <div id="kontakt" class="contact-group">
          <div class="contact-copy">
            <p class="section-label">Kontakt</p>
            <h2>S čím mohu pomoci?</h2>

            <div class="contact-row">
              <span>E-mail</span>
              <a href="mailto:info@martamluvi.cz">info@martamluvi.cz</a>
            </div>

            <div class="contact-row">
              <span>Telefon</span>
              <a href="tel:+420737754951">737 754 951</a>
            </div>
          </div>

          <form id="order-form" class="contact-form">
            <h3>Kontaktní formulář</h3>

            <label>
              <span>Text</span>
              <textarea
                rows="4"
                placeholder="Napiš, co potřebuješ."
                name="message"
              ></textarea>
            </label>

            <div class="form-grid">
              <label>
                <span>Tvoje jméno</span>
                <input type="text" placeholder="Tvoje jméno" name="name" />
              </label>

              <label>
                <span>Tvůj e-mail</span>
                <input type="email" placeholder="Tvůj e-mail" name="email" />
              </label>

              <label>
                <span>Tvůj telefon</span>
                <input type="tel" placeholder="Tvůj telefon" name="phone" />
              </label>
            </div>

            <button type="submit" class="button secondary">Odeslat</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Marta Beni</p>
      <p>Tanvaldská 1335, 182 00 Praha</p>
      <p>IČO: 23351012</p>
      <p><a href="gdpr.html">Zásady zpracování osobních údajů (GDPR)</a></p>
    </footer>
  </body>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script src="index.js" defer></script>
</html>
